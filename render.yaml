# Render Infrastructure-as-Code Deployment Blueprint
# Project: Personal Website AI Assistant - Digital Twin (Alemu Kibret Mulugeta)

services:
  # 1. FastAPI Backend Service
  - type: web
    name: digital-twin-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r requirements.txt && pip install -e ."
    startCommand: "uvicorn apps.backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health/liveness
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: digital-twin-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: digital-twin-redis
          property: connectionString
      - key: ACTIVE_LLM_PROVIDER
        value: google_gemini
      - key: ACTIVE_EMBEDDING_PROVIDER
        value: openai

databases:
  # 2. PostgreSQL Database with pgvector extension support
  - name: digital-twin-db
    databaseName: digital_twin
    user: postgres
    region: oregon
    plan: starter
    postgresMajorVersion: "16"

# 3. Redis Cache & Rate Limiting Service
redis:
  - name: digital-twin-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru
