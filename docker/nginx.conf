# Production Nginx Reverse Proxy Configuration
# Optimized for FastAPI, Server-Sent Events (SSE) streaming, and WebSockets

server {
    listen 80;
    server_name api.alemukibret.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.alemukibret.dev;

    ssl_certificate /etc/letsencrypt/live/api.alemukibret.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.alemukibret.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Global CORS Headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key' always;

    # Static Widget JS & CSS Delivery
    location /widget.js {
        alias /var/www/widget/widget.js;
        add_header Content-Type application/javascript;
        add_header Cache-Control "public, max-age=86400";
    }

    location /widget.css {
        alias /var/www/widget/widget.css;
        add_header Content-Type text/css;
        add_header Cache-Control "public, max-age=86400";
    }

    # REST API Endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE Streaming Endpoint (Disable Response Buffering)
    location /api/v1/chat/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Disable buffering for live token-by-token streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
    }

    # WebSocket Real-Time Connection
    location /api/v1/chat/ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
